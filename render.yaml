databases:
  - name: mcb-spin-wheel-db
    plan: free
    databaseName: mcb_spin_wheel
    user: mcb_spin_wheel

services:
  - type: web
    name: mcb-spin-the-wheel
    runtime: node
    plan: free
    branch: claude/spin-wheel-web-app-4hl02m
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: mcb-spin-wheel-db
          property: connectionString
